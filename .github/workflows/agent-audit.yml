name: Agentic — Oversight & Audit

# This workflow is REPORT-ONLY. It analyses the code and surfaces findings as
# build logs / artifacts. It never modifies source files and never pushes back
# to the repository. (A previous version injected JSX comments into source and
# committed them to main, which repeatedly broke compilation.)
#
# It covers:
# 1. UI Interaction Auditor (dead/suspicious buttons)
# 2. Background Security Auditing (pattern scan)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  agentic-audit:
    name: Agentic Oversight & UI Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # --- 1. UI Interaction Audit (report-only) ---
      - name: Run UI Interaction Auditor
        run: python3 scripts/ui_auditor.py

      - name: Upload UI audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-audit-report
          path: ui_audit_report.md
          if-no-files-found: ignore

      # --- 2. Security Audit (pattern scan, advisory only) ---
      - name: Run Background Security Audit
        run: |
          echo "Running security pattern scan..."
          grep -rn "eval(" . || true
          grep -rn "dangerouslySetInnerHTML" . || true

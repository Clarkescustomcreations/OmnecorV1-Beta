name: Build Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Force actions still bundling the Node.js 20 runtime to use Node.js 24 instead.
# GitHub deprecated the Node 20 runtime for actions on June 16, 2026.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test

  linux-build:
    runs-on: ubuntu-latest
    needs: typecheck-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Electron Linux build
        run: |
          cd packaging/electron-app
          pnpm install --frozen-lockfile
          pnpm build
          pnpm exec electron-builder --linux --publish never
        env:
          USE_HARD_LINKS: false

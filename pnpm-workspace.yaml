packages:
  - "."
  - "packaging/electron-app"
  - "packaging/android/omnecor-hq"

ignoredBuiltDependencies:
  - "@tailwindcss/oxide"
  - "esbuild"

# Native modules whose install/build script MUST run so the compiled binding
# (or downloaded prebuilt) is present. pnpm v10 blocks all build scripts by
# default; without this allowlist `pnpm install` silently ships better-sqlite3
# with no native binding and the SQLite DB layer fails to load at runtime.
onlyBuiltDependencies:
  - "better-sqlite3"
  - "electron"
  - "node-pty"
  - "onnxruntime-node"

# Dependency `overrides` MUST live here, not in the root package.json's `pnpm`
# field. In a pnpm workspace (this repo has a pnpm-workspace.yaml) pnpm 10.x
# reads settings from this file and IGNORES the `pnpm` field in package.json —
# pnpm prints "The 'pnpm' field in package.json is no longer read by pnpm" and
# silently drops it. Keeping overrides here is what makes the tar/rollup/etc.
# security pins actually apply.
overrides:
  # Build/tooling pins
  "@builder.io/vite-plugin-jsx-loc": "0.1.1"
  "@esbuild-kit/core-utils>esbuild": ">=0.25.0"
  # esbuild RCE via NPM_CONFIG_REGISTRY (GHSA-gv7w-rqvm-qjhr, high) + arbitrary
  # file read on Windows dev server (GHSA-g7r4-m6w7-qqqr, low). Only reaches us
  # through the mobile chain nativewind>tailwindcss>postcss-load-config>tsx>esbuild.
  # Scoped to tsx so the legacy @esbuild-kit chain above keeps its old esbuild.
  "tsx>esbuild": ">=0.28.1"
  "@expo/ngrok>uuid": ">=11.1.1"
  # Security pins (CVE / GHSA remediation — keep floors, allow forward patches)
  "@trpc/server": ">=11.8.0"
  "dompurify": ">=3.4.0"
  "drizzle-orm": ">=0.45.2"
  "fast-xml-parser": ">=5.5.6"
  "lodash": ">=4.18.0"
  "lodash-es": ">=4.18.0"
  "mdast-util-to-hast": ">=13.2.1"
  "mermaid": ">=11.15.0"
  "path-to-regexp": ">=0.1.13"
  # Dev-tree advisories (build tooling): ReDoS, CSS-stringify XSS, pnpm lockfile/script bypass
  "picomatch": ">=4.0.4"
  "pnpm": ">=10.28.2"
  "postcss": ">=8.5.10"
  "rollup": ">=4.59.0"
  "shell-quote": ">=1.8.4"
  "simple-oauth2>joi": ">=18.2.1"
  "tailwindcss>nanoid": "3.3.7"
  "tar": ">=7.5.11"
  # uuid buffer-bounds advisory (GHSA-w5hq-g745-h8pq) — old uuid only reaches us
  # through Expo build tooling (xcode, @expo/ngrok); scoped so app deps keep uuid 14
  "xcode>uuid": ">=11.1.1"

patchedDependencies:
  llama.rn: patches/llama.rn.patch
  "wouter@3.7.1": patches/wouter@3.7.1.patch

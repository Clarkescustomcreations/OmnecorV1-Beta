appId: com.omnecor.workstation
productName: Omnecor
copyright: Copyright © 2026 Omnecor Team

directories:
  output: dist
  buildResources: build

# Files included in the app package
files:
  - out/**/*
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml,package-lock.json}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!tailwind.config.js'
  - '!postcss.config.cjs'

# Unpack from ASAR: backend dist (Node.js child process) and native modules
asarUnpack:
  - resources/**
  - backend/**
  - node_modules/onnxruntime-node
  - node_modules/better-sqlite3
  - node_modules/bindings
  - node_modules/file-uri-to-path

# Bundle the compiled Omnecor backend alongside the Electron app
extraResources:
  # Pre-built backend bundle (run `pnpm build` in project root first)
  - from: ../../dist
    to: app.asar.unpacked/backend
    filter:
      - "index.js"
  # Drizzle migration files — required for DB schema setup on fresh installs
  - from: ../../drizzle/migrations
    to: app.asar.unpacked/backend/drizzle/migrations
    filter:
      - "**/*"
  # Frontend static assets (Vite build output)
  - from: ../../dist/public
    to: app.asar.unpacked/backend/public
    filter:
      - "**/*"
  # Native modules required by backend (libSQL DB driver, onnxruntime, etc.)
  # libSQL is the unified DB engine: its JS is esbuild-bundled, but the native
  # binding (@libsql/<platform> → index.node) loads via a runtime require() that
  # the bundler can't follow, so the @libsql + libsql packages MUST ship on disk
  # or the backend crashes on boot with "Cannot find module '@libsql/<platform>'".
  - from: ../../node_modules
    to: app.asar.unpacked/node_modules
    filter:
      - "@libsql/**/*"
      - "libsql/**/*"
      - "better-sqlite3/**/*"
      - "bindings/**/*"
      - "file-uri-to-path/**/*"
      - "onnxruntime-node/**/*"
  # Packaging scripts (install.sh, ollama_install.sh, post-install.sh)
  - from: ../scripts
    to: scripts
    filter:
      - "**/*"
  # Model recommendation metadata (packaging/models/)
  - from: ../models
    to: models
    filter:
      - "**/*"
  # Valet Router artifact registry — current.json + any gguf weights placed here by
  # `pnpm valet:fetch` before a desktop build. The GGUF is NOT in git; it is published
  # as a GitHub Release asset and downloaded by scripts/fetch-valet-model.sh. Only
  # current.json and metadata.json are regular git commits.
  - from: ../../models/valet-router
    to: models/valet-router
    filter:
      - "current.json"
      - "**/metadata.json"
      - "**/*.gguf"
  # Valet Router inference server — Python bridge script + training knowledge docs.
  # These must be present in resources so the spawned Python process can find them.
  - from: ../../server/python_bridges/valet_router_inference.py
    to: python_bridges/valet_router_inference.py
  - from: ../../docs/ai-agents/valet-training
    to: docs/ai-agents/valet-training
    filter:
      - "**/*"

# ─── Windows ────────────────────────────────────────────────────────────────
win:
  target:
    - nsis
    - portable
  icon: build/icon.ico
  artifactName: ${productName}-Setup-${version}.${ext}
  requestedExecutionLevel: asInvoker

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeader: build/installer_header.bmp
  installerSidebar: build/installer_sidebar.bmp
  runAfterFinish: true
  shortcutName: Omnecor HMCI
  warningsAsErrors: false
  include: ../windows/omnecor.nsh

portable:
  artifactName: ${productName}-${version}-portable.${ext}

# ─── Linux ──────────────────────────────────────────────────────────────────
linux:
  target:
    - AppImage
    - deb
  category: Development
  icon: build/icon.png
  maintainer: Omnecor Team <dev@omnecor.local>
  vendor: Omnecor
  desktop:
    Name: Omnecor
    Comment: Human-Machine Collaboration Interface
    Categories: Development;AI;Science;

appImage:
  artifactName: ${productName}-${version}-${arch}.AppImage

deb:
  packageName: omnecor-hmci
  depends:
    - libnotify4
    - libxtst6
    - libnss3
    - nodejs
    - python3
  afterInstall: ../deb/debian/postinst
  artifactName: ${productName}_${version}_${arch}.deb

rpm:
  artifactName: ${productName}-${version}.${arch}.rpm

# ─── Android (Capacitor thin client) ─────────────────────────────────────────
# Build via: pnpm build:android → npx cap open android → Android Studio APK
# The capacitor.config.ts controls the server URL for LAN connections.

# ─── Publishing ─────────────────────────────────────────────────────────────
publish:
  provider: github
  owner: omnecor
  repo: workstation
  releaseType: draft

npmRebuild: true

name: Agentic — Oversight & Audit

# This workflow combines:
# 1. Automated Code Review (Self-Correction)
# 2. "Living" Documentation Sync
# 3. Background Security Auditing
# 4. UI Interaction Auditor (Custom)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write   # Required to commit audit findings back to code
  pull-requests: write

jobs:
  agentic-audit:
    name: Agentic Oversight & UI Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # --- 1. UI Interaction Audit ---
      - name: Run UI Interaction Auditor
        run: python3 scripts/ui_auditor.py

      # --- 2. Security Audit (YARA + Pattern Scan) ---
      # Runs the existing security scans in headless mode
      - name: Run Background Security Audit
        run: |
          # Placeholder for headless security script
          echo "Running security pattern scan..."
          grep -rn "eval(" . || true
          grep -rn "dangerouslySetInnerHTML" . || true

      # --- 3. Living Documentation Sync ---
      # Auto-updates architecture docs if routes have changed
      - name: Sync Architecture Documentation
        run: |
          echo "Checking for router changes..."
          if git diff --name-only HEAD~1 | grep "server/routers/"; then
            echo "Router changes detected. Updating DATA_FLOW.md..."
            # Simple script to append new routers to docs
            ls server/routers/ > docs/architecture/ROUTER_INVENTORY.md
          fi

      # --- 4. Commit Findings Back to Repository ---
      - name: Commit Audit Findings
        run: |
          git config --global user.name "Omnecor-Agent-Bot"
          git config --global user.email "agent-bot@omnecor.local"
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "chore: agentic audit findings and UX suggestions"
            git push
          else
            echo "No findings to commit."
          fi

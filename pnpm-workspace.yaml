packages:
  - "."
  - "packaging/electron-app"
  - "packaging/android/omnecor-hq"

# Flat node_modules. REQUIRED for the Expo/Metro APK build: Metro's Babel
# transform worker loads presets/plugins (babel-preset-expo and its transitive
# @babel/plugin-* deps) via the ROOT @babel/core, which only resolves them when
# they're hoisted to the top-level node_modules. pnpm 11 IGNORES `node-linker`
# from .npmrc in a workspace (same reason overrides must live here, not in
# package.json), so the setting must be declared here or the install silently
# falls back to the isolated layout and `expo run:android` / assembleRelease
# fails at `createBundleReleaseJsAndAssets` with "Cannot find module '@babel/…'".
nodeLinker: hoisted

# pnpm v11: allowBuilds replaces onlyBuiltDependencies. true = permit build
# scripts; false = block them. Native bindings and prebuilt downloads must be
# true or the compiled module is missing at runtime.
allowBuilds:
  better-sqlite3: true
  electron: true
  esbuild: false
  llama.rn: true
  node-pty: true
  onnxruntime-node: true
  postinstall-postinstall: true
  react-native-litert-lm: true
  unrs-resolver: true

ignoredBuiltDependencies:
  - "@tailwindcss/oxide"

# Dependency `overrides` MUST live here, not in the root package.json's `pnpm`
# field. In a pnpm workspace (this repo has a pnpm-workspace.yaml) pnpm 10.x
# reads settings from this file and IGNORES the `pnpm` field in package.json —
# pnpm prints "The 'pnpm' field in package.json is no longer read by pnpm" and
# silently drops it. Keeping overrides here is what makes the tar/rollup/etc.
# security pins actually apply.
overrides:
  # Build/tooling pins
  "@builder.io/vite-plugin-jsx-loc": "0.1.1"
  # esbuild RCE via NPM_CONFIG_REGISTRY (GHSA-gv7w-rqvm-qjhr, high — fixed in
  # 0.28.1) + arbitrary file read on Windows dev server (GHSA-g7r4-m6w7-qqqr,
  # low — fixed in 0.25.0). A GLOBAL floor is required: vite's bundled esbuild
  # (0.27.7), the legacy @esbuild-kit/core-utils chain (0.25.x), our own build
  # esbuild, and the tsx chain all sit below 0.28.1 otherwise. A single global
  # pin forces every esbuild copy past the RCE fix.
  "esbuild": ">=0.28.1"
  # ws memory-exhaustion DoS from tiny fragments / data chunks (GHSA — fixed in
  # 8.21.0; backported to 7.5.11 / 6.2.4). Our direct dep resolved to 8.20.1
  # (pre-fix); pin the 8.x line forward to the patched release.
  "ws": ">=8.21.0"
  "@expo/ngrok>uuid": ">=11.1.1"
  # Security pins (CVE / GHSA remediation — keep floors, allow forward patches)
  # form-data CRLF injection (GHSA-fjxv-7rqg-78g4) — only 4.0.x in tree, safe global floor.
  "form-data": ">=4.0.6"
  # @babel/core arbitrary file read via sourceMappingURL (GHSA-4x5r-pxfx-6jf8) — all 7.x.
  "@babel/core": ">=7.29.6"
  # js-yaml merge-key quadratic DoS (GHSA-h67p-54hq-rp68) — fix only ships in 4.2.0.
  # SCOPED to the one legacy 3.x consumer; a global floor would force js-yaml v4
  # (no safeLoad) onto @istanbuljs/load-nyc-config and break it.
  "@istanbuljs/load-nyc-config>js-yaml": ">=4.2.0"
  "@trpc/server": ">=11.8.0"
  # dompurify (via streamdown>mermaid): ALLOWED_ATTR pollution + SAFE_FOR_TEMPLATES /
  # Trusted-Types bypasses (web-runtime XSS-adjacent in chat diagram sanitization).
  # Highest patched floor across the 3 advisories is 3.4.11.
  "dompurify": ">=3.4.11"
  # undici (via @react-three/fiber>expo>@expo/cli): WebSocket DoS + header injection +
  # Set-Cookie SameSite downgrade. Build-tooling. NOTE: a >=6.27.0 floor lets pnpm
  # jump to undici 8.x, where 8.0.0–8.4.x reintroduce a TLS-validation-bypass + WS DoS
  # (patched 8.5.0); pin to the patched 8.x floor.
  "undici": ">=8.5.0"
  # hono (via @modelcontextprotocol/sdk): CORS reflects any Origin + body-limit bypass.
  # Patched in 4.12.25.
  "hono": ">=4.12.25"
  # markdown-it (via mobile react-native-markdown-display): quadratic-complexity DoS.
  # Patched in 14.2.0. NOTE: mobile-only — verify the APK build on a build machine.
  "markdown-it": ">=14.2.0"
  "drizzle-orm": ">=0.45.2"
  "fast-xml-parser": ">=5.5.6"
  "lodash": ">=4.18.0"
  "lodash-es": ">=4.18.0"
  "mdast-util-to-hast": ">=13.2.1"
  "mermaid": ">=11.15.0"
  "express>path-to-regexp": "0.1.13"
  # Dev-tree advisories (build tooling): ReDoS, CSS-stringify XSS, pnpm lockfile/script bypass
  "picomatch": ">=4.0.4"
  "pnpm": ">=11.8.0"
  "postcss": ">=8.5.10"
  "rollup": ">=4.59.0"
  "shell-quote": ">=1.8.4"
  "simple-oauth2>joi": ">=18.2.1"
  "tailwindcss>nanoid": "3.3.7"
  "tar": ">=7.5.11"
  # adm-zip crafted-ZIP memory-allocation DoS (CVE-2026-39244 / GHSA-xcpc-8h2w-3j85,
  # Dependabot #346/#347). Reaches us ONLY transitively via onnxruntime-node
  # (^0.5.16), which uses adm-zip to unpack its OWN release artifacts (trusted
  # inputs) — the app never feeds an untrusted ZIP through this path, so real
  # exposure is nil. NO patched release exists on npm yet (latest is 0.5.17; the
  # advisory names 0.5.18/0.6.0, unpublished), so a version pin is impossible
  # today — DO NOT add `"adm-zip": ">=0.5.18"` (install would fail to resolve).
  # Add the floor the moment a patched release ships.
  # uuid buffer-bounds advisory (GHSA-w5hq-g745-h8pq) — old uuid only reaches us
  # through Expo build tooling (xcode, @expo/ngrok); scoped so app deps keep uuid 14
  "xcode>uuid": ">=11.1.1"

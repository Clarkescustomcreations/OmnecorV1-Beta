<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Omnecor</title>
<script>
  // SPA redirect: encode the current path into a query param and send to index
  var base = '/OmnecorV1-Beta/demo';
  var l = window.location;
  var path = l.pathname.slice(base.length) || '/';
  l.replace(
    l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
    base + '/?p=' + encodeURIComponent(path) +
    (l.search ? '&' + l.search.slice(1) : '') +
    l.hash
  );
</script>
</head>
<body></body>
</html>

name: Omnecor — Release Artifacts

# Runs on tagged releases (v*.*.*) only.
# Builds the Linux AppImage/deb, Windows NSIS, and Android APK.

on:
  push:
    tags:
      - 'v*.*.*'

# Force actions still bundling the Node.js 20 runtime to use Node.js 24 instead.
# GitHub deprecated the Node 20 runtime for actions on June 16, 2026.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-shared:
    name: Build Backend & Web Assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Backend & Web
        run: pnpm run build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  package-linux:
    name: Package Linux (.AppImage, .deb)
    needs: build-shared
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Install Electron dependencies
        run: cd packaging/electron-app && pnpm install --frozen-lockfile

      - name: Build Electron Assets
        run: cd packaging/electron-app && pnpm run build

      - name: Package Linux
        run: cd packaging/electron-app && npx electron-builder --linux
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packaging/electron-app/dist/*.AppImage
            packaging/electron-app/dist/*.deb

  package-windows:
    name: Package Windows (.exe)
    needs: build-shared
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Install Electron dependencies
        run: |
          cd packaging/electron-app
          pnpm install --frozen-lockfile

      - name: Build Electron Assets
        run: |
          cd packaging/electron-app
          pnpm run build

      - name: Package Windows
        run: |
          cd packaging/electron-app
          npx electron-builder --win
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packaging/electron-app/dist/*.exe

  package-android:
    name: Package Android (Omnecor HQ APK)
    needs: build-shared
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK + CMake (required for the llama.rn native build)
        run: sdkmanager "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: packaging/android/omnecor-hq

      - name: Prebuild (generate the android/ Gradle project)
        run: pnpm prebuild:android
        working-directory: packaging/android/omnecor-hq

      - name: Build debug APK
        run: pnpm apk:debug
        working-directory: packaging/android/omnecor-hq

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packaging/android/omnecor-hq/android/app/build/outputs/apk/debug/app-debug.apk

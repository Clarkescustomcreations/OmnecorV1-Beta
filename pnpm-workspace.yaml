packages:
  - "."

overrides:
  # Existing overrides (migrated from package.json#pnpm.overrides — no longer read in pnpm v10)
  "tailwindcss>nanoid": "3.3.7"
  "@builder.io/vite-plugin-jsx-loc": "0.1.1"

  # Security: esbuild dev-server advisory (GHSA-67mh-4wv8-2f99) in drizzle-kit transitive dep
  "@esbuild-kit/core-utils>esbuild": ">=0.25.0"

  # Security: fast-xml-parser critical + high CVEs via @aws-sdk (GHSA-m7jm-9gc2-mpf2, GHSA-fj3w-jwp8-x2g3, etc.)
  "fast-xml-parser": ">=5.5.6"

  # Security: tar arbitrary file overwrite/traversal chain of CVEs (GHSA-* multiple)
  "tar": ">=7.5.11"

  # Security: rollup path traversal (GHSA-*) via vite
  "rollup": ">=4.59.0"

  # Security: path-to-regexp ReDoS
  "path-to-regexp": ">=0.1.13"

patchedDependencies:
  "wouter@3.7.1": patches/wouter@3.7.1.patch

# Native modules whose install/build script MUST run so the compiled binding
# (or downloaded prebuilt) is present. pnpm v10 blocks all build scripts by
# default; without this allowlist `pnpm install` silently ships better-sqlite3
# with no native binding and the SQLite DB layer fails to load at runtime.
onlyBuiltDependencies:
  - "better-sqlite3"

ignoredBuiltDependencies:
  - "@tailwindcss/oxide"
  - "esbuild"
